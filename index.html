<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bee Bros — Mario-style platformer</title>
  </head>
  <body>
    <div id="game-wrap">
      <div id="app"></div>

      <div id="touch-controls">
        <div id="touch-left-group">
          <button id="btn-left" class="touch-btn" aria-label="Move left">◀</button>
          <button id="btn-right" class="touch-btn" aria-label="Move right">▶</button>
        </div>
        <div id="touch-right-group">
          <button id="btn-throw" class="touch-btn" aria-label="Throw stone">●</button>
          <button id="btn-dash" class="touch-btn" aria-label="Dash">⚡</button>
          <button id="btn-jump" class="touch-btn touch-btn-big" aria-label="Jump">▲</button>
        </div>
      </div>
    </div>
    <p id="hint">Arrow keys / WASD to move, Up / W to jump, Space / F to throw, Shift to dash</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
